<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automan Car Purchase Management</title>
    <link rel="stylesheet" href="styles.css?v=1762499000">
    <style>
        #root {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- Rixo Mapping Management Modal -->
    <div id="rixoMappingModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Manage Rixo Mappings</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <!-- Dynamic content will be inserted here -->
            </div>
            <div class="modal-footer">
                <button id="saveMappings" class="btn btn-primary">Save Changes</button>
                <button id="cancelMappings" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>
    
    <!-- Application Scripts -->
    <!-- Webpack bundles the Kotlin runtime into automan-car-purchase.js, 
         so only our custom helpers plus the bundle need to be loaded. -->
    <script src="rixo-price-mapping.js?v=1762684000"></script>
    <script src="booking-mapping.js?v=1762413065"></script>
    <script src="booking-mapping-modal.js?v=1762413066"></script>
        <script src="automan-car-purchase.js?v=1762687000"></script>
</body>
</html>
