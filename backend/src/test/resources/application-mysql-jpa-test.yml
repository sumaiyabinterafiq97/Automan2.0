# Disposable MySQL integration (see PurchaseChassisKeyMysqlJpaTest). Not used for default CI unless Docker is available.
spring:
  flyway:
    enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  autoconfigure:
    exclude: []

automan:
  media:
    r2:
      enabled: false

app:
  auth:
    setup-max-attempts: 1000
