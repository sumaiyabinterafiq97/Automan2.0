# Production overrides. Activate with SPRING_PROFILES_ACTIVE=docker,prod.
# The docker profile alone uses ddl-auto update and Flyway baseline 37. This profile
# must be last so it replaces those settings.
#
# Hibernate validates the schema and does not add or drop columns.
# Flyway still applies pending migrations when flyway_schema_history exists.
# baseline-on-migrate and baseline-version 1 apply only when that history table is
# absent. Confirm the table already ends at V84 before the first start of a release
# that contains V85–V91. A missing history table would baseline at 1 and replay
# older scripts, including deletes and column drops.
# sql.init.mode never: schema.sql and data.sql do not run.
spring:
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never

management:
  endpoint:
    health:
      show-details: never
