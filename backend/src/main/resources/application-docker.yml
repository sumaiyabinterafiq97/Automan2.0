spring:
  flyway:
    # Docker MySQL is pre-seeded by database/01-init-multiplatform.sql before Flyway runs;
    # without baseline, Flyway refuses non-empty schemas with no flyway_schema_history.
    baseline-on-migrate: true
    # Match latest migration: docker MySQL is seeded by database/01-init-multiplatform.sql on first start.
    baseline-version: 37
  datasource:
    # Hostname "mysql" resolves only inside Docker Compose; override via SPRING_DATASOURCE_URL for host bootRun.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/automan_car_purchase?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&zeroDateTimeBehavior=convertToNull&jdbcCompliantTruncation=false}
    username: ${SPRING_DATASOURCE_USERNAME:automan_user}
    password: ${SPRING_DATASOURCE_PASSWORD:automan_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
  
  sql:
    init:
      mode: always
      continue-on-error: true

server:
  port: ${PORT:8083}
  servlet:
    context-path: /api

app:
  mail:
    admin-email: ${APP_MAIL_ADMIN_EMAIL:automan.dev.team@gmail.com}
    resend-api-key: ${RESEND_API_KEY:}
    from: "Automan <onboarding@resend.dev>"
    validate-mx: ${APP_MAIL_VALIDATE_MX:true}
  verification-base-url: ${APP_VERIFICATION_BASE_URL:http://localhost:8083/api}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:8080}
  auth:
    token-secret: ${APP_AUTH_TOKEN_SECRET:${random.uuid}}
    token-ttl-hours: ${APP_AUTH_TOKEN_TTL_HOURS:24}

logging:
  level:
    com.automan.backend: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
