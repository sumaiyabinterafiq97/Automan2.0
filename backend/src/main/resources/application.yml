spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  datasource:
    url: jdbc:mysql://localhost:3306/automan_car_purchase?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=30000&zeroDateTimeBehavior=convertToNull&jdbcCompliantTruncation=false
    username: automan_user
    password: automan_password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: ${PORT:8083}
  servlet:
    context-path: /api

# Email (Resend) and verification
app:
  mail:
    admin-email: ${APP_MAIL_ADMIN_EMAIL:automan.dev.team@gmail.com}
    resend-api-key: ${RESEND_API_KEY:}
    from: "Automan <onboarding@resend.dev>"
    validate-mx: ${APP_MAIL_VALIDATE_MX:true}
  verification-base-url: ${APP_VERIFICATION_BASE_URL:http://localhost:8083/api}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:8080}

# Car picture storage (Cloudflare R2)
automan:
  media:
    r2:
      enabled: ${R2_ENABLED:false}
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket-name: ${R2_BUCKET_NAME:}
      endpoint: ${R2_ENDPOINT:}
      presigned-url-ttl-seconds: ${MEDIA_PRESIGNED_URL_TTL_SECONDS:3600}
      max-file-size-bytes: ${MEDIA_MAX_FILE_SIZE_BYTES:5242880}
      max-files-per-purchase: ${MEDIA_MAX_FILES_PER_PURCHASE:20}

logging:
  level:
    root: INFO
    com.automan: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.boot.autoconfigure: WARN
    org.springframework.orm.jpa: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: DEBUG
    org.springframework.context.annotation.ComponentScan: DEBUG
