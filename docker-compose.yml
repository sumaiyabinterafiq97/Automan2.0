services:
  mysql:
    image: mysql:8.0
    container_name: automan_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: automan_car_purchase
      MYSQL_USER: automan_user
      MYSQL_PASSWORD: automan_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - automan_network

  backend:
    build: ./backend
    container_name: automan_backend
    restart: always
    ports:
      - "8083:8083"
    depends_on:
      - mysql
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/automan_car_purchase?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: automan_user
      SPRING_DATASOURCE_PASSWORD: automan_password
    networks:
      - automan_network

  frontend:
    build: .
    container_name: automan_frontend
    restart: always
    ports:
      - "9090:8080"
    depends_on:
      - backend
    networks:
      - automan_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: automan_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: automan_user
      PMA_PASSWORD: automan_password
    ports:
      - "8082:80"
    depends_on:
      - mysql
    networks:
      - automan_network

volumes:
  mysql_data:

networks:
  automan_network:
    driver: bridge
