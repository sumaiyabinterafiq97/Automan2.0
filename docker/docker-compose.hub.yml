# Pull pre-built images from Docker Hub (AWS / staging).
# Copy docker/.env.hub.example → docker/.env and fill RDS + DOCKERHUB_USERNAME, then:
#   docker compose --env-file docker/.env -f docker/docker-compose.hub.yml pull
#   docker compose --env-file docker/.env -f docker/docker-compose.hub.yml up -d
#
# Or export variables and use sudo -E:
#   export DOCKERHUB_USERNAME=yourhubuser
#   export RDS_ENDPOINT=... RDS_USERNAME=... RDS_PASSWORD=...

version: '3.8'

services:
  backend:
    image: ${DOCKERHUB_USERNAME}/automan-backend:latest
    container_name: automan_backend_prod
    restart: always
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker,prod
      SPRING_DATASOURCE_URL: jdbc:mysql://${RDS_ENDPOINT}:3306/automan_car_purchase?useSSL=true&requireSSL=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${RDS_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${RDS_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/api/purchases"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - automan_network

  frontend:
    image: ${DOCKERHUB_USERNAME}/automan-frontend:latest
    container_name: automan_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - automan_network

networks:
  automan_network:
    driver: bridge
