# Pull pre-built images from Docker Hub (AWS / staging).
# Copy docker/.env.hub.example → docker/.env and fill RDS + DOCKERHUB_USERNAME, then:
#   docker compose --env-file docker/.env -f docker/docker-compose.hub.yml pull
#   docker compose --env-file docker/.env -f docker/docker-compose.hub.yml up -d
#
# Required in docker/.env or the shell: DOCKERHUB_USERNAME, AUTOMAN_IMAGE_TAG,
# RDS_ENDPOINT, RDS_USERNAME, RDS_PASSWORD, APP_FRONTEND_URL, APP_VERIFICATION_BASE_URL.
# AUTOMAN_IMAGE_TAG is the release commit, not latest.
# Optional: RESEND_API_KEY, APP_MAIL_ADMIN_EMAIL, GMAIL_*, R2_*.

version: '3.8'

services:
  backend:
    image: ${DOCKERHUB_USERNAME}/automan-backend:${AUTOMAN_IMAGE_TAG:?Set AUTOMAN_IMAGE_TAG to the release commit}
    container_name: automan_backend_prod
    restart: always
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker,prod
      SPRING_DATASOURCE_URL: jdbc:mysql://${RDS_ENDPOINT}:3306/automan_car_purchase?useSSL=true&requireSSL=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${RDS_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${RDS_PASSWORD}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:?Set APP_FRONTEND_URL to the public site origin}
      APP_VERIFICATION_BASE_URL: ${APP_VERIFICATION_BASE_URL:?Set APP_VERIFICATION_BASE_URL to the public API origin ending in /api}
      APP_MAIL_ADMIN_EMAIL: ${APP_MAIL_ADMIN_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      GMAIL_USERNAME: ${GMAIL_USERNAME:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GMAIL_SMTP_HOST: ${GMAIL_SMTP_HOST:-smtp.gmail.com}
      GMAIL_SMTP_PORT: ${GMAIL_SMTP_PORT:-587}
      R2_ENABLED: ${R2_ENABLED:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - automan_network

  frontend:
    image: ${DOCKERHUB_USERNAME}/automan-frontend:${AUTOMAN_IMAGE_TAG:?Set AUTOMAN_IMAGE_TAG to the release commit}
    container_name: automan_frontend_prod
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - automan_network

networks:
  automan_network:
    driver: bridge
