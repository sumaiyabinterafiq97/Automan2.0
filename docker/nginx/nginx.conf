server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver for dynamic DNS resolution (allows backend to start after frontend)
    resolver 127.0.0.11 valid=30s;

    # Serve static files directly (JS, CSS, images, etc.)
    # For JS files with version query params, use shorter cache
    location ~* \.(js|css)$ {
        root /usr/share/nginx/html;
        # Check if URL has version query parameter - if yes, allow caching but shorter
        if ($args ~ "v=") {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }
        # For files without version, cache longer
        if ($args !~ "v=") {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        try_files $uri =404;
    }
    
    # Other static files (images, fonts, etc.)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy API to backend (host port 8083 — Docker publish or local bootRun).
    location /api/ {
        set $backend_host host.docker.internal;
        proxy_pass http://$backend_host:8083;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Strip Origin to avoid backend CORS handling
        proxy_set_header Origin "";
    }

    # Serve frontend SPA - fallback to index.html for routes
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
